<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
    <title>Vitruvian Fit</title>

    <!-- PWA & Mobile Meta Tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1E40AF" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vitruvian Fit" />
    <link rel="apple-touch-icon" href="/assets/icon-192x192.png" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            colors: {
              'primary': '#1E40AF',
              'primary-dark': '#1E3A8A',
              'secondary': '#DB2777',
              
              // Dark Theme
              'dark-bg': '#111827', // gray-900
              'dark-card': '#1F2937', // gray-800
              'dark-border': '#374151', // gray-700
              'dark-text': '#F9FAFB', // gray-50
              'dark-text-secondary': '#9CA3AF', // gray-400
              
              // Light Theme
              'light-bg': '#F3F4F6', // gray-100
              'light-card': '#FFFFFF', // white
              'light-border': '#E5E7EB', // gray-200
              'light-text': '#111827', // gray-900
              'light-text-secondary': '#6B7280', // gray-500
            }
          }
        }
      }
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.1.0/",
    "react/": "https://esm.sh/react@^19.1.0/",
    "react": "https://esm.sh/react@^19.1.0"
  }
}
</script>
<style>
      html, body, #root {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      /* Custom Scrollbar Styles */
      /* For Webkit-based browsers (Chrome, Safari, Edge) */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: transparent;
      }

      ::-webkit-scrollbar-thumb {
        background-color: #D1D5DB; /* gray-300 */
        border-radius: 10px;
        border: 2px solid transparent;
        background-clip: content-box;
      }

      ::-webkit-scrollbar-thumb:hover {
        background-color: #9CA3AF; /* gray-400 */
      }

      /* Dark Theme Scrollbar */
      .dark ::-webkit-scrollbar-thumb {
        background-color: #374151; /* gray-700 */
      }

      .dark ::-webkit-scrollbar-thumb:hover {
        background-color: #4B5563; /* gray-600 */
      }
      
      /* For Firefox */
      html {
        scrollbar-width: thin;
        scrollbar-color: #D1D5DB transparent; /* thumb track */
      }

      .dark html {
        scrollbar-color: #374151 transparent; /* thumb track */
      }

      /* Safe Area Insets for Mobile Devices */
      .safe-top-padding {
          padding-top: env(safe-area-inset-top);
      }
      .safe-bottom-padding {
          padding-bottom: env(safe-area-inset-bottom);
      }
      .safe-left-padding {
          padding-left: env(safe-area-inset-left);
      }
      .safe-right-padding {
          padding-right: env(safe-area-inset-right);
      }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/service-worker.js')
            .then(registration => {
              console.log('Vitruvian Fit PWA: ServiceWorker registration successful with scope: ', registration.scope);
            })
            .catch(err => {
              console.log('Vitruvian Fit PWA: ServiceWorker registration failed: ', err);
            });
        });
      }
    </script>
  </body>
</html>
